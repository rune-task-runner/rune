# Generated by rune ci github. Do not edit: change the Runefile, then run:
#   rune ci github --branch "it's" --rune-version 0.11.0 --output ../../.github/workflows/api.yml all
name: rune
on:
  push:
    branches: ['it''s']
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: 'services/api'
jobs:
  greet-a-b-it-s-fine:
    name: 'greet "a b" "it''s fine"'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install rune 0.11.0
        shell: bash
        run: |
          set -euo pipefail
          version=0.11.0
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "rune: no release for $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "rune: no release for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="rune_${version}_${os}_${arch}.tar.gz"
          url="https://github.com/rune-task-runner/rune/releases/download/v${version}"
          dir="$RUNNER_TEMP/rune-bin"
          mkdir -p "$dir"
          curl -sSfL --retry 3 -o "$dir/$archive" "$url/$archive"
          curl -sSfL --retry 3 -o "$dir/checksums.txt" "$url/checksums.txt"
          (cd "$dir" && awk -v name="$archive" '$2 == name' checksums.txt | shasum -a 256 -c -)
          tar -xzf "$dir/$archive" -C "$dir" rune
          echo "$dir" >> "$GITHUB_PATH"
      - name: 'Run greet "a b" "it''s fine"'
        shell: bash
        run: |
          rune ci run --dir "$RUNNER_TEMP/rune-ci" -- greet "a b" "it's fine"
