version: 2

project_name: rune

before:
  hooks:
    - go mod tidy

builds:
  - id: rune
    main: ./cmd/rune
    binary: rune
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: rune
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Single source of release notes is git-cliff: the release workflow renders them and
# passes the file with --release-notes, which GoReleaser then uses as the release body
# instead of generating its own changelog.
# Do NOT add `changelog: disable: true` here. It also discards the --release-notes
# file, and the release is published with an empty body (v0.7.0 to v0.8.0 shipped that
# way). test/release guards this.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: rune-task-runner
    name: rune
  # Tags like v1.2.0-rc.1 are auto-flagged as GitHub pre-releases.
  prerelease: auto

# --- Container image (multi-arch GHCR) --------------------------------------
# Built and pushed by ko, with no Docker daemon. `build: rune` reuses the main
# package, flags, ldflags and env of the archive build above, so the binary in
# the image is byte-identical to the one in the archive (CI compares them).
# The base image supplies what ko cannot set: the /work working directory, the
# /rune link and RUNE_CONTAINER=1 (scripts/build-base-image.sh). It is pinned
# by digest and kept in the same package as the image, under a base-<id> tag,
# so there is one package to find and one set of permissions; .ko.yaml carries the same digest for local builds and
# test/release fails when they differ.
# ko publishes one multi-platform index. The release workflow adds the
# <version>-amd64 and <version>-arm64 tags afterwards.
kos:
  - id: rune
    build: rune
    base_image: "ghcr.io/rune-task-runner/rune@sha256:44efecf469cd05923b7d60e53208353b7f067f5072f9dad420bf810631f16e35"
    repositories:
      - ghcr.io/rune-task-runner/rune
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      # Empty for a prerelease, and ko skips an empty tag: only a stable
      # release moves `latest`.
      - "{{ if not .Prerelease }}latest{{ end }}"
    bare: true
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A shared task runner for humans and AI agents"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/rune-task-runner/rune"
      org.opencontainers.image.licenses: "MIT"

# --- Supply chain: SBOMs, signing, provenance -------------------------------
# One SPDX-JSON SBOM per archive (syft).
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.spdx.json"

# Sign checksums.txt with cosign keyless (covers every archive transitively).
# NOTE: artifacts defaults to `none` — it MUST be set explicitly.
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    output: true

# Sign the published image with cosign keyless (by digest). --recursive signs
# the index and both per-architecture images it lists.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "--recursive"
      - "${artifact}@${digest}"
      - "--yes"
    output: true

# --- Package managers (dedicated tap/bucket repos) --------------------------
# `homebrew_casks` (NOT the deprecated `brews`) is the supported mechanism for a
# prebuilt CLI binary. skip_upload: auto keeps prereleases off the stable channel.
homebrew_casks:
  - name: rune
    repository:
      owner: rune-task-runner
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/rune-task-runner/rune"
    description: "A shared task runner for humans and AI agents"
    skip_upload: auto
    commit_author:
      name: rune-release-bot
      email: rune-release-bot@users.noreply.github.com
    # The binary is not Apple-notarized (see docs/releasing.md follow-ups);
    # strip the quarantine attribute so it runs without a Gatekeeper prompt.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/rune"]
          end

scoops:
  - name: rune
    repository:
      owner: rune-task-runner
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/rune-task-runner/rune"
    description: "A shared task runner for humans and AI agents"
    license: MIT
    skip_upload: auto
    commit_author:
      name: rune-release-bot
      email: rune-release-bot@users.noreply.github.com
