name: Release

# Maintainer-initiated release: pick a bump (and optionally a prerelease); this workflow
# computes the next vX.Y.Z, updates the changelog, tags, and publishes everything via
# GoReleaser. See specs/006-release-automation/contracts/release-workflow.md.
#
# TODO(hardening): pin all third-party actions to commit SHAs (Dependabot keeps them
# fresh). Floating major tags are used here for readability; see research.md §J.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver component to bump"
        type: choice
        options: [patch, minor, major]
        required: true
      prerelease:
        description: "Cut a prerelease (-rc.N)"
        type: boolean
        default: false

permissions:
  contents: write # create the release, push the tag + changelog commit
  packages: write # push images to GHCR
  id-token: write # cosign keyless + attestation OIDC
  attestations: write # GitHub build-provenance attestations

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: release # protected env with required reviewers (authorized maintainers)
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.ver.outputs.tag }} # consumed by publish-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # TAP_GITHUB_TOKEN is the release PAT (an org admin's, so it bypasses the
          # main ruleset for the changelog commit + tag push); the same secret is
          # handed to GoReleaser for the Homebrew/Scoop commits below. Falls back
          # to the default token if unset.
          token: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Guard — clean tree and green CI for HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty; refusing to release"; exit 1
          fi
          # Check the CI workflow's own conclusion for this commit. Do NOT inspect *all*
          # check-runs: this Release run registers its own in-progress check-run ("release")
          # on the same commit, which is never "success" yet — that would self-deadlock.
          ci=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=push" \
                 --jq 'if (.workflow_runs | length) == 0 then "missing"
                       else (.workflow_runs | sort_by(.run_started_at) | last | .conclusion // "pending") end')
          if [ "$ci" != "success" ]; then
            echo "::error::CI (ci.yml) for ${{ github.sha }} is '${ci}', not success; refusing to release"; exit 1
          fi

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          # Derive the target from the latest STABLE tag (vX.Y.Z, no suffix) — not the
          # latest tag, which may be a prerelease. This is what makes rc iteration and
          # promotion work with just bump + prerelease:
          #   bump + prerelease=true  (repeatedly) -> rc.1, rc.2, ... of the SAME target
          #   bump + prerelease=false                -> that target as a stable release (promote)
          # Stable tags are sorted numerically (git's versionsort mis-ranks prereleases).
          # `|| true`: grep exits 1 when there are no stable tags, which under
          # `pipefail` would abort the step — tolerate the empty result instead.
          last_stable=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)
          last_stable="${last_stable:-0.0.0}"
          MA="${last_stable%%.*}"; rest="${last_stable#*.}"; MI="${rest%%.*}"; PA="${rest##*.}"
          case "${{ inputs.bump }}" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          target="${MA}.${MI}.${PA}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            maxrc=$(git tag --list "v${target}-rc.*" | sed -E "s/^v${target}-rc\.//" \
              | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)
            next="v${target}-rc.$(( ${maxrc:-0} + 1 ))"
          else
            next="v${target}"
          fi
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null 2>&1; then
            echo "::error::tag ${next} already exists; refusing to re-release"; exit 1
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          # Empty when there is no stable tag yet (the very first release).
          if git rev-parse -q --verify "refs/tags/v${last_stable}" >/dev/null 2>&1; then
            echo "last_stable=v${last_stable}" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing ${next} (last stable: v${last_stable}, target: v${target})"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update CHANGELOG.md and render release notes
        env:
          # git-cliff's [remote.github] integration calls the GitHub API to enrich
          # commits; without a token it gets rate-limited (HTTP 403) and panics.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          last_stable="${{ steps.ver.outputs.last_stable }}"
          if [ "${{ inputs.prerelease }}" != "true" ] && [ -n "$last_stable" ]; then
            # A stable release describes everything since the previous STABLE release.
            # Its release candidates already took those commits into their own sections,
            # so "since the latest tag" would leave a promoted release with empty notes.
            # Ignoring the rc tags folds their commits into this section.
            git cliff "${last_stable}..HEAD" --ignore-tags 'rc\.[0-9]+$' --tag "$tag" --prepend CHANGELOG.md
            git cliff "${last_stable}..HEAD" --ignore-tags 'rc\.[0-9]+$' --tag "$tag" --strip header > /tmp/release-notes.md
          else
            git cliff --unreleased --tag "$tag" --prepend CHANGELOG.md
            git cliff --latest --tag "$tag" --strip header > /tmp/release-notes.md
          fi
          echo "----- release notes -----"; cat /tmp/release-notes.md

      - name: Commit changelog and create tag
        run: |
          set -euo pipefail
          git config user.name  "rune-release-bot"
          git config user.email "rune-release-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            git add CHANGELOG.md
            git commit -m "chore(release): ${{ steps.ver.outputs.tag }}"
            git push origin HEAD:main
          fi
          git tag -a "${{ steps.ver.outputs.tag }}" -m "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      # The image is built and pushed by ko inside GoReleaser, with no Docker
      # daemon, emulation or builder. crane writes the registry credential that
      # ko, cosign and crane itself read, and adds the per-architecture tags below.
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Attest binary provenance (covers all archives via checksums)
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt

      - name: Resolve published image digest
        id: image
        run: |
          set -euo pipefail
          # GoReleaser tags images with {{.Version}} (the tag WITHOUT the leading "v"),
          # so strip it to match the published ref.
          ver="${{ steps.ver.outputs.tag }}"; ver="${ver#v}"
          digest=$(crane digest "ghcr.io/rune-task-runner/rune:${ver}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/rune-task-runner/rune
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # ko publishes one multi-platform index under the version tag. These tags
      # name the two images that index lists, so <version>-amd64 is the same
      # image a pull of <version> gets on amd64. It runs last: a failure here must not
      # cost the release its provenance, and the tags can be added by hand afterwards
      # (docs/releasing.md).
      - name: Tag per-architecture images
        run: |
          set -euo pipefail
          repo=ghcr.io/rune-task-runner/rune
          ver="${{ steps.image.outputs.version }}"
          for arch in amd64 arm64; do
            d=$(crane digest --platform "linux/${arch}" "${repo}:${ver}")
            crane tag "${repo}@${d}" "${ver}-${arch}"
          done

  # Publishes the VS Code extension for STABLE releases only (specs/015,
  # contracts/publishing-pipeline.md). Strictly additive: a failure here never
  # un-ships binaries/images/tag — recover by re-running this job (registries
  # reject duplicate versions, so re-runs are idempotent) or publishing the
  # release-asset .vsix manually; see docs/releasing.md. Reusing the protected
  # `release` environment means required reviewers approve this job separately
  # (a second prompt per release) — accepted trade-off to keep the tokens gated.
  publish-extension:
    name: publish-extension
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !inputs.prerelease }}
    environment: release
    permissions:
      contents: write # upload the .vsix release asset
    env:
      TAG: ${{ needs.release.outputs.tag }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The repo carries a 0.0.0 placeholder; the published version is the
      # release tag minus the leading "v". Never committed.
      - name: Stamp extension version from the release tag
        run: npm version --no-git-tag-version "${TAG#v}"

      - name: Package
        id: package
        run: npx vsce package

      # Attach before publishing so even a both-registries outage leaves the
      # exact artifact recoverable from the release page. Both publishes are
      # gated on this step (contract P4: attach precedes publish).
      - name: Attach .vsix to the GitHub release
        id: attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "runefile-${TAG#v}.vsix" --clobber

      # --skip-duplicate makes re-runs idempotent AND green: an
      # already-published version is a logged no-op, not a step failure
      # (contract P6). Accidental double-publish of a tag is prevented
      # upstream by the release job's tag-exists check.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --skip-duplicate --packagePath "runefile-${TAG#v}.vsix"

      # Same .vsix, separate step. Runs even if the Marketplace step failed —
      # but only when the artifact was attached (P4) — so on a re-run after a
      # partial success the missing registry still publishes (P6/P7).
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.attach.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --skip-duplicate "runefile-${TAG#v}.vsix"
