name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "internal/docsite/**"
      - "cmd/docsite/**"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time, and never cancel one in flight: a cancelled
# deploy can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Generate site content
        run: go run ./cmd/docsite
      - name: Install site dependencies
        run: npm ci --prefix website
      - name: Build site
        run: npm run build --prefix website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
