# Test harness for Rune. Per project policy, the test suite runs inside this
# container, never directly on the host.
#
#   docker compose run --rm test            # full suite: go test ./...
#   docker compose run --rm test go vet ./...
#   docker compose run --rm test go build ./...
#
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=mod"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["go", "test", "./..."]

  # The tests that start a real sandbox (spec 053). A default container cannot
  # create namespaces, so this one runs privileged. Their fixtures live outside
  # /tmp, which the sandbox replaces with a private directory.
  #
  #   docker compose run --rm test-sandbox go test ./internal/sandbox/...
  #   docker compose run --rm test-sandbox go test ./test/integration/... -run Sandbox
  #
  test-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /src
    privileged: true
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=mod"
      RUNE_TEST_SANDBOX: "require"
      RUNE_TEST_SANDBOX_DIR: /var/lib/rune-sandbox-test
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["go", "test", "./internal/sandbox/..."]

  # Documentation site toolchain. Node runs in a container so the site builds
  # without a host Node install, matching the test service's policy.
  website:
    image: node:22
    working_dir: /src/website
    environment:
      npm_config_cache: /npm-cache
    volumes:
      - .:/src
      - npm-cache:/npm-cache
    ports:
      - "4321:4321"
    command: ["npm", "run", "dev"]

volumes:
  go-mod-cache:
  go-build-cache:
  npm-cache:
